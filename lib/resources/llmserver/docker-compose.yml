services:
  # LLMサーバー: Llama.cpp Server
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-server
    restart: always
    ports:
      - "8080:8080"
    labels:
      com.datadoghq.ad.logs: '[{"source": "openwebui", "service": "llm"}]'
    environment:
      - LLAMA_ARG_HF_REPO=Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:q8_0
      # - LLAMA_ARG_THREADS=2       # 使用するCPUスレッド数（基本はデフォルトで良い）
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_N_PARALLEL=3      # 並列スロット数。同時に処理できるリクエストの数
      - LLAMA_ARG_CTX_SIZE=98304    # サーバー全体で使用するコンテキストサイズの総量（トークン単位）。使用モデルの最大コンテキストサイズ×並列スロット数を設定。
      - LLAMA_ARG_MLOCK=true        # RAM内のモデルデータのスワップ禁止（推論速度向上）
      - LLAMA_ARG_MMAP=true         # サーバー起動時にモデルの全データをメモリに読み込む（推論速度向上）
    
    # ==================================
    # 環境変数で指定できないパラメーター
    # ==================================
    # --repeat-penalty: 同じ言葉の繰り返しを抑制
    # --min-p         : 指定した%未満の確率が低いトークン（確信度が低いトークン）を回答候補から除外する
    # --temp          : 低いほど決定論的な回答で一貫性があり、高いほど創造的で多様な回答をする
    command: >
      --repeat-penalty 1.1
      --min-p 0.05
      --temp 0.1